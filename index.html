<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Daily forecasts of Cascadia slow-slip velocity from SSECast." />
  <title>SSECast | Cascadia daily forecast</title>
  <style>
    :root{--ink:#102a32;--muted:#5f7075;--paper:#fbfcfb;--line:#cbd5d4;--teal:#126b70}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,polygon:focus-visible{outline:2px solid var(--teal);outline-offset:2px}.loading{min-height:100vh;display:grid;place-content:center;text-align:center;color:var(--muted)}.loading b{display:block;color:var(--teal);font:600 4rem/1 Georgia,serif}.topbar,.hero,.workspace,.delay,footer{max-width:1240px;margin-inline:auto}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;font-size:.92rem;font-weight:700;letter-spacing:.015em}.brand i{display:grid;place-items:center;width:27px;height:27px;background:var(--teal);color:#fff;font-style:normal;font-size:.62rem}.sync{font-size:.7rem;color:var(--muted);letter-spacing:.025em}.sync:before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#34a270}.sync button{margin-left:7px;border:0;background:transparent;color:var(--teal);font-weight:700;text-decoration:underline}.hero{display:flex;justify-content:space-between;gap:40px;padding:46px 0 36px;border-bottom:2px solid var(--ink)}.eyebrow,.fig,.control-title{margin:0 0 10px;color:var(--teal);font-size:.64rem;font-weight:800;letter-spacing:.15em}.hero h1{margin:0 0 15px;font:600 clamp(3.3rem,5.6vw,5.7rem)/.92 Georgia,serif;letter-spacing:-.05em}.hero p.copy{max-width:610px;margin:0;color:var(--muted);font-size:.96rem;line-height:1.6}.meta{min-width:315px;padding:3px 0 0 25px;border-left:1px solid var(--line);display:grid;gap:5px}.meta span{font-size:.61rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}.meta b{margin-bottom:15px;font:500 .82rem ui-monospace,SFMono-Regular,Menlo,monospace}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 270px;padding:30px 0 36px}.map-panel,.controls{border:1px solid var(--line)}.map-panel{padding:21px;border-right:0;background:#fff}.controls{padding:21px 19px;background:#f5f8f7}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:17px;padding-bottom:15px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font:600 clamp(1.35rem,1.9vw,1.8rem)/1.05 Georgia,serif;letter-spacing:-.02em}.range{display:grid;grid-template-columns:auto 142px auto;align-items:center;gap:7px;color:var(--muted);font:500 .68rem ui-monospace,SFMono-Regular,Menlo,monospace}.gradient{height:7px;background:linear-gradient(90deg,#397fa6,#f5f5ef 50%,#bd3e32)}.range small{grid-column:1/-1;text-align:center;font:normal .65rem Arial,sans-serif;letter-spacing:.08em}.fault{display:block;width:min(100%,750px);margin:auto;border:1px solid #b8c8ca;background:#eaf1f5}.grid line{stroke:#53737b;stroke-width:.7;stroke-dasharray:3 4;opacity:.35}.coast{pointer-events:none}.coast polyline{stroke:#102a32;stroke-width:1.35;stroke-linejoin:round;opacity:.86}.labels{pointer-events:none}.labels text{fill:#334e55;font-size:10px;font-weight:700;paint-order:stroke;stroke:#eaf1f5;stroke-width:3px;stroke-linejoin:round}.patch{cursor:crosshair;stroke:rgba(255,255,255,.48);stroke-width:.16}.footerline{width:min(100%,750px);margin:10px auto 0;padding-top:10px;border-top:1px solid var(--line);font:500 .68rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.footerline b{color:var(--ink)}.control-title{padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--line)}.block+.block{margin-top:23px}.segment{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}.segment button{border:0;background:transparent;padding:9px 5px;color:var(--muted);font-size:.68rem;font-weight:700}.segment button+button{border-left:1px solid var(--line)}.segment button.active{background:var(--ink);color:#fff}.component,.dates{border-top:1px solid var(--line)}.component button,.dates button{width:100%;display:flex;align-items:center;gap:8px;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--muted);font-size:.76rem}.component button i{width:6px;height:6px;background:#c7d5d4}.component button.selected,.dates button.selected{border-left:3px solid var(--teal);padding-left:8px;color:var(--ink);font-weight:700}.component button.selected i{background:var(--teal)}.dates{max-height:300px;overflow:auto}.dates button{justify-content:space-between}.dates span,.dates b{font:500 .68rem ui-monospace,SFMono-Regular,Menlo,monospace}.dates span{font-size:.62rem}.delay{padding:26px 0 50px;border-top:2px solid var(--ink)}.delay h2{margin:0 0 9px;font:600 1.28rem Georgia,serif}.delay p:last-child{max-width:690px;margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}footer{padding:17px 0 25px;border-top:1px solid var(--line);color:var(--muted);font:500 .63rem ui-monospace,SFMono-Regular,Menlo,monospace}
    @media(max-width:1280px){.topbar,.hero,.workspace,.delay,footer{margin-inline:28px}}@media(max-width:780px){.topbar,.hero,.workspace,.delay,footer{margin-inline:20px}.topbar{height:auto;padding:14px 0;gap:14px;align-items:flex-start}.sync{text-align:right;line-height:1.5}.hero{display:block;padding:35px 0 25px}.meta{margin-top:25px;padding:18px 0 0;border-left:0;border-top:1px solid var(--line);grid-template-columns:auto 1fr}.meta b{margin:0}.workspace{grid-template-columns:1fr;padding:22px 0 28px}.map-panel{padding:14px;border-right:1px solid var(--line)}.controls{border-top:0}.panel-head{display:block}.range{width:225px;margin-top:15px}.fault,.footerline{width:100%}}
  </style>
</head>
<body><main id="app" class="loading"><div><b>◌</b><p>Loading the Daily SSECast forecast…</p></div></main>
<script>
const LIMIT=8, labels=["Slip","Strike","Dip"]; let snapshot,coast,mode="forecast",day=13,component=0,hover=null;
const fmt=n=>new Intl.NumberFormat("en-US",{maximumFractionDigits:2,minimumFractionDigits:0}).format(n);
const color=v=>{const a=Math.min(1,Math.abs(v)/LIMIT),l=96-a*51;return v>=0?`hsl(9 78% ${l}%)`:`hsl(202 68% ${l}%)`};
function mapSvg(values){const w=480,h=650,p=18,allLon=snapshot.lon.flat(),allLat=snapshot.lat.flat(),minLon=Math.min(...allLon),maxLon=Math.max(...allLon),minLat=Math.min(...allLat),maxLat=Math.max(...allLat);const x=v=>p+(v-minLon)/(maxLon-minLon)*(w-p*2),y=v=>h-p-(v-minLat)/(maxLat-minLat)*(h-p*2),project=(lo,la)=>`${x(lo)},${y(la)}`;const polys=snapshot.lon.map((tri,i)=>`<polygon class="patch" tabindex="0" data-id="${i}" data-value="${values[i]}" points="${tri.map((lo,j)=>project(lo,snapshot.lat[i][j])).join(" ")}" fill="${color(values[i])}"><title>Patch ${i+1}: ${fmt(values[i])} mm/day</title></polygon>`).join("");const paths=coast.lines.map(line=>`<polyline points="${line.map(([lo,la])=>project(lo,la)).join(" ")}" fill="none"/>`).join("");const lonTicks=[-128,-126,-124,-122].filter(t=>t>minLon&&t<maxLon),latTicks=[40,42,44,46,48,50].filter(t=>t>minLat&&t<maxLat);return `<svg class="fault" viewBox="0 0 ${w} ${h}" role="img" aria-label="Cascadia fault slip velocity map"><rect width="${w}" height="${h}" fill="#eaf1f5"/>${polys}<g class="grid">${lonTicks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="18" y2="632"/>`).join("")}${latTicks.map(t=>`<line x1="18" x2="462" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g><g class="coast">${paths}</g><g class="labels">${lonTicks.map(t=>`<text x="${x(t)}" y="644" text-anchor="middle">${Math.abs(t)}°W</text>`).join("")}${latTicks.map(t=>`<text x="22" y="${y(t)-4}">${t}°N</text>`).join("")}</g></svg>`}
function render(){const dates=mode==="forecast"?snapshot.forecast_dates:snapshot.input_dates;day=Math.min(day,dates.length-1);const values=(mode==="forecast"?snapshot.forecast_velocity_mm_per_day:snapshot.input_velocity_mm_per_day)[day][component],selected=dates[day];document.querySelector("#app").className="";document.querySelector("#app").innerHTML=`<div class="topbar"><div class="brand"><i>DS</i>Daily SSECast</div><div class="sync">Auto-refresh check every 5 min <button id="refresh">Refresh now</button></div></div><section class="hero"><div><p class="eyebrow">CASCADIA · DAILY FORECAST</p><h1>SSECast</h1><p class="copy">A deep-learning framework that advances two daily GNSS-derived slip-potency fields to forecast the next 14 days of slow-slip initiation, migration and decay along the Cascadia plate interface.</p></div><div class="meta"><span>Current input</span><b>${snapshot.input_dates[0]} — ${snapshot.input_dates[1]}</b><span>Forecast horizon</span><b>${snapshot.forecast_dates[0]} — ${snapshot.forecast_dates.at(-1)}</b></div></section><section class="workspace"><div class="map-panel"><div class="panel-head"><div><p class="fig">FIG. 01 · CASCADIA SLIP-VELOCITY FIELD</p><h2>${selected}</h2></div><div class="range"><span>−${LIMIT}</span><div class="gradient"></div><span>+${LIMIT}</span><small>mm/day</small></div></div>${mapSvg(values)}<div id="hover" class="footerline">Hover a patch for its value</div></div><aside class="controls"><p class="control-title">VIEW PARAMETERS</p><div class="block"><p class="eyebrow">DISPLAY</p><div class="segment"><button data-mode="input" class="${mode==='input'?'active':''}">Latest inputs</button><button data-mode="forecast" class="${mode==='forecast'?'active':''}">14-day forecast</button></div></div><div class="block"><p class="eyebrow">COMPONENT</p><div class="component">${labels.map((l,i)=>`<button data-component="${i}" class="${i===component?'selected':''}"><i></i>${l}</button>`).join('')}</div></div><div class="block"><p class="eyebrow">${mode==='forecast'?'FORECAST DAY':'INPUT DATE'}</p><div class="dates">${dates.map((d,i)=>`<button data-day="${i}" class="${i===day?'selected':''}"><span>${mode==='forecast'?`D${i+1}`:`Input ${i+1}`}</span><b>${d}</b></button>`).join('')}</div></div></aside></section><section class="delay"><p class="eyebrow">FILTERING DELAY</p><h2>Results are shown with a three-day delay.</h2><p>Filtering used in the inversion adds a three-day delay. All displayed results therefore represent conditions from three days before the displayed date.</p></section><footer>Daily SSECast · Cascadia slow-slip forecast · Snapshot ${new Date(snapshot.generated_at_utc).toUTCString()}</footer>`;bind()}
function bind(){document.querySelector('#refresh').onclick=load;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;day=mode==='input'?1:0;hover=null;render()});document.querySelectorAll('[data-component]').forEach(b=>b.onclick=()=>{component=+b.dataset.component;hover=null;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;hover=null;render()});document.querySelectorAll('.patch').forEach(p=>{const show=()=>document.querySelector('#hover').innerHTML=`Patch ${+p.dataset.id+1}: <b>${fmt(+p.dataset.value)} mm/day</b>`;p.onpointerenter=show;p.onfocus=show;p.onpointerleave=()=>document.querySelector('#hover').textContent='Hover a patch for its value';p.onblur=()=>document.querySelector('#hover').textContent='Hover a patch for its value'})}
async function load(){try{const [a,b]=await Promise.all([fetch('./data/dashboard_snapshot.json',{cache:'no-store'}),fetch('./data/coastline.json',{cache:'force-cache'})]);if(!a.ok||!b.ok)throw Error();snapshot=await a.json();coast=await b.json();render()}catch{document.querySelector('#app').innerHTML='<div class="loading"><div><b>!</b><p>The forecast snapshot could not be loaded. Please retry shortly.</p></div></div>'}}
load();setInterval(load,300000);
</script></body></html>
